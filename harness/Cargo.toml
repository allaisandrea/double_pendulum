[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
apriltag = "0.4"
arrow-array = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
image = { version = "0.25", default-features = false }
jpeg-encoder = { version = "0.7", features = ["simd"] }
libc = "0.2"
mach2 = "0.4"
# camera-sync-impl makes Camera Send, so it can be opened on the main thread
# and handed to the capture thread; nokhwa's own threaded camera relies on it.
nokhwa = { version = "0.10", features = ["input-native", "camera-sync-impl"] }
rand = "0.10.3"
serialport = "4.10.1"

[profile.dev]
# The detector and JPEG encoder are unusably slow unoptimized.
opt-level = 2

[patch.crates-io]
# Makes external USB cameras visible on macOS 13; see the PATCHED.md there.
nokhwa-bindings-macos = { path = "vendor/nokhwa-bindings-macos" }
