[package]
name = "apriltag-cam"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
apriltag = "0.4"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
image = { version = "0.25", default-features = false }
jpeg-encoder = { version = "0.7", features = ["simd"] }
nokhwa = { version = "0.10", features = ["input-native"] }

[profile.dev]
# The detector and JPEG encoder are unusably slow unoptimized.
opt-level = 2
