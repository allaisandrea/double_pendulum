# The rig's eras: stretches of recordings with one geometry, where each pivot
# sits on its link and each tag on its link (common.calibration_lib). A new
# era starts when the rig itself changes; the camera, which drifts by
# millimetres between sessions, is fitted for every recording instead. Each
# era's geometry is calibration/<name>.json, from common.calibrate geometry.

