[project]
name = "learning"
version = "0.1.0"
description = "Learning for the double pendulum: a world model of it, trained on collect's frames tables."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "torch>=2.4",
    "wandb>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "imagination", "world_model"]
