# Recordings are directories under data_dir holding frames.arrows.
data_dir = "data"
# As base.toml, without the trained policy's collection: the random-walk
# recordings alone, to compare against on the same validation sets.
train = ["1790282998", "1790279628"]

# Steps of history the model sees. The action reaches the motor about
# 27 ms (3-4 frames) after capture, so this needs to reach well past that.
window = 16
hidden = 256
layers = 3

batch_size = 1024
# The learning rate warms up linearly over warmup_steps, holds at lr, and
# cools down to zero as 1 - sqrt over the last cooldown_fraction of steps.
lr = 1e-3
warmup_steps = 300
cooldown_fraction = 0.2
weight_decay = 1e-4
steps = 20000
bce_weight = 0.1
seed = 0

log_every = 50
eval_every = 1000
# Full training state, for --resume and --branch; also at each step in
# checkpoint_at.
checkpoint_every = 10000
# Windows in each fixed evaluation sample, and the rollout horizons, in
# frames (8 ms each), whose 1 - R² is logged.
eval_samples = 4096
horizons = [1, 4, 16, 64, 125]

wandb_project = "double-pendulum-world-model"

# Each validation set's metrics are logged under its name.
[val]
val_random_walk = ["1790281442"]
val_policy = ["1790374602"]
val_policy_wm2 = ["1790378604"]
val_policy_wm3 = ["1790464558"]
