# The 256 x 3 Gaussian (the rebootstrap's) on calibrated link angles
# (2026-10-02; common.calibrate) instead of tag yaws, on the rig as it is now only: every recording (greedy tests included) but its validation set, to tell what the angles do apart from the old data.
# val_old is the earlier rig's pooled validation set (stochastic.toml's
# val_all), val_new the two 20-minute collections flow-2.toml holds out.
data_dir = "data"
observation = "angles"
train = [
    "1790789841", "1790791100", "1790793694", "1790794013", "1790797815", "1790798133", "1790801535",
    "1790814173", "1790815402", "1790816632", "1790817862", "1790819094", "1790820333", "1790821607",
    "1790822847", "1790824091", "1790825348", "1790825675", "1790826915", "1790828159", "1790870082",
    "1790870406", "1790872817", "1790873141", "1790880870", "1790882148", "1790883428", "1790884681",
    "1790891028", "1790892285", "1790893543", "1790894798", "1790896036", "1790897267",
]

window = 16
hidden = 256
layers = 3
stochastic = true
nll_beta = 0.5

batch_size = 4096
lr = 2e-3
warmup_steps = 1000
cooldown_fraction = 0.2
weight_decay = 1e-4
# The loop's world models' length.
steps = 250000
max_grad_norm = 1.0
bce_weight = 0.1
seed = 0
compile = true
bf16 = true

log_every = 50
eval_every = 25000
checkpoint_every = 25000
eval_samples = 4096
eval_stride = 16
eval_ensemble = 8
# The ensemble on every 4th window (0.5 s apart), as flow-2.toml's.
eval_ensemble_stride = 4
horizons = [1, 4, 16, 64, 125]

wandb_project = "double-pendulum-world-model"

[val]
val_old = [
    "1790281442", "1790374602", "1790378604", "1790464558", "1790611634", "1790619211", "1790626779",
    "1790636181", "1790644962",
]
val_new = [
    "1790878360", "1790879599",
]
